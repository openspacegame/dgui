[package]
name = "dgui"
version = "0.1.0"
edition = "2024"
description = "A transient frame tree GUI with flex layout and keyed state"
license = "MIT OR Apache-2.0"

[dependencies]
ahash = "0.8"
egui = "0.36"
taffy = "0.9"
generational-box = "0.7"
futures-util = "0.3"

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
